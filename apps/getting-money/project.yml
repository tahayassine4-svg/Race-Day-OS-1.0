name: GettingMoney
options:
  bundleIdPrefix: com.gettingmoney
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"

targets:
  GettingMoney:
    type: application
    platform: iOS
    sources:
      - path: GettingMoney
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gettingmoney.GettingMoney
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Getting Money
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GettingMoneyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GettingMoneyTests
    dependencies:
      - target: GettingMoney
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gettingmoney.GettingMoneyTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GettingMoney:
    build:
      targets:
        GettingMoney: all
        GettingMoneyTests: [test]
    test:
      targets:
        - GettingMoneyTests
