name: GettingMoney
options:
  bundleIdPrefix: com.yassine.gettingmoney
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: X8W4Z2A6JN

targets:
  GettingMoney:
    type: application
    platform: iOS
    sources:
      - path: GettingMoney
      - path: Shared
    dependencies:
      - target: GettingMoneyWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yassine.gettingmoney
        CODE_SIGN_ENTITLEMENTS: GettingMoney/GettingMoney.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Getting Money
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GettingMoneyWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: GettingMoneyWidget
      - path: Shared
    info:
      path: GettingMoneyWidget/Info.plist
      properties:
        CFBundleDisplayName: Getting Money
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yassine.gettingmoney.widget
        CODE_SIGN_ENTITLEMENTS: GettingMoneyWidget/GettingMoneyWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GettingMoneyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GettingMoneyTests
    dependencies:
      - target: GettingMoney
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yassine.gettingmoney.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GettingMoney:
    build:
      targets:
        GettingMoney: all
        GettingMoneyWidgetExtension: all
        GettingMoneyTests: [test]
    test:
      targets:
        - GettingMoneyTests
