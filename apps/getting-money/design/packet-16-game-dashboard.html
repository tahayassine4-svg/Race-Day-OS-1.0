<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1">
  <title>Getting Money — Game Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0A0D0B;
      --surface:   #131714;
      --elevated:  #1B201C;
      --hairline:  #2A302C;
      --ink:       #F3F7F1;
      --muted:     #8A938C;
      --accent:    #AEE63D;
      --success:   #5FD08A;
      --warning:   #F2C14E;
      --debt:      #FF6A5A;
      --coin:      #FFD700;
    }

    html, body {
      width: 393px;
      height: 852px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Courier New', Courier, monospace;
    }

    .screen {
      display: flex;
      flex-direction: column;
      width: 393px;
      height: 852px;
      background: var(--bg);
      overflow: hidden;
    }

    /* ─── STATUS BAR ─────────────────────────── */
    .status-bar {
      flex-shrink: 0;
      height: 44px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 8px;
    }
    .status-bar .time {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--ink);
      font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
    }
    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-bar .icons svg {
      display: block;
    }

    /* ─── HUD BAR ────────────────────────────── */
    .hud {
      flex-shrink: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1.5px solid var(--hairline);
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-streak {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hud-streak .streak-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-balance {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .hud-balance .bal-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--coin);
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }
    .debt-badge {
      background: var(--debt);
      color: #FFF;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      letter-spacing: 0.04em;
      border-radius: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* ─── EXERCISE SELECTOR ──────────────────── */
    .exercise-selector {
      flex-shrink: 0;
      padding: 10px 20px 8px;
      display: flex;
      gap: 0;
      background: var(--bg);
    }
    .seg {
      flex: 1;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1.5px solid var(--hairline);
      color: var(--muted);
      background: var(--surface);
    }
    .seg:first-child {
      border-radius: 2px 0 0 2px;
    }
    .seg:last-child {
      border-radius: 0 2px 2px 0;
    }
    .seg.active {
      background: var(--accent);
      color: #0A0D0B;
      border-color: var(--accent);
      z-index: 1;
    }

    /* ─── PROGRESS BAR ───────────────────────── */
    .progress-row {
      flex-shrink: 0;
      padding: 0 20px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pixel-bar {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
    }
    .pixel-seg {
      width: 10px;
      height: 16px;
      border-radius: 1px;
      flex-shrink: 0;
    }
    .pixel-seg.filled {
      background: var(--accent);
    }
    .pixel-seg.empty {
      background: var(--elevated);
      border: 1px solid var(--hairline);
    }
    .prog-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .prog-label span {
      color: var(--ink);
    }

    /* ─── ARENA ──────────────────────────────── */
    .arena {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0A0D0B;
    }

    /* Pixel star dots in sky */
    .arena-sky {
      position: absolute;
      top: 0; left: 0; right: 0;
      bottom: 25%;
    }

    .star {
      position: absolute;
      background: #1E2820;
      border-radius: 0;
    }

    /* Stage line (depth) */
    .arena-stage-line {
      position: absolute;
      left: 0; right: 0;
      bottom: 25%;
      height: 2px;
      background: var(--hairline);
    }

    /* Ground strip */
    .arena-ground {
      position: absolute;
      left: 0; right: 0;
      bottom: calc(25% - 10px);
      height: 10px;
      background: #1A2020;
    }

    /* Arena floor (below ground) */
    .arena-floor {
      position: absolute;
      left: 0; right: 0;
      bottom: 0;
      height: calc(25% - 10px);
      background: #0D1010;
    }

    /* Character container */
    .character-wrap {
      position: absolute;
      bottom: calc(25% - 4px);
      left: 50%;
      transform: translateX(-50%);
      width: 276px;
      height: 276px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .character-wrap img {
      width: 276px;
      height: 276px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    /* ─── TAP TO REP ─────────────────────────── */
    .tap-hint {
      flex-shrink: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tap-dot {
      width: 4px;
      height: 4px;
      background: var(--muted);
      border-radius: 0;
      opacity: 0.6;
    }
    .tap-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ─── SESSION STRIP ──────────────────────── */
    .session-strip {
      flex-shrink: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .session-text {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .session-earned {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .session-divider {
      color: var(--hairline);
      font-size: 11px;
    }

    /* ─── BOTTOM NAV STRIP ───────────────────── */
    .bottom-nav {
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-top: 1px solid var(--hairline);
    }
    .bottom-link {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .bottom-link.debt-link {
      color: var(--debt);
    }

    /* ─── TAB BAR ────────────────────────────── */
    .tab-bar {
      flex-shrink: 0;
      height: 83px;
      background: var(--surface);
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: flex-start;
      padding-top: 10px;
    }
    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .tab.active .tab-label {
      color: var(--accent);
    }
    .home-indicator {
      height: 34px;
      background: var(--surface);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8px;
    }
    .home-pill {
      width: 134px;
      height: 5px;
      background: var(--ink);
      border-radius: 3px;
      opacity: 0.18;
    }
  </style>
</head>
