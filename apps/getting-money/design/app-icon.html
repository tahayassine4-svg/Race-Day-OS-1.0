<!doctype html><html><head><meta charset="utf-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1024px;height:1024px;}
  .icon{width:1024px;height:1024px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 90% at 78% 8%, rgba(174,230,61,.22), transparent 55%),
      radial-gradient(90% 70% at 12% 108%, rgba(255,106,90,.10), transparent 55%),
      linear-gradient(160deg,#10140F,#080A08);
    display:flex;align-items:center;justify-content:center;}
  .coin{width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #E6FF82, #AEE63D 52%, #7CB726 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 40px 120px rgba(174,230,61,.35), inset 0 -18px 50px rgba(80,110,20,.55), inset 0 14px 40px rgba(255,255,255,.45);}
  .coin .ring{position:absolute;width:560px;height:560px;border-radius:50%;border:10px solid rgba(255,255,255,.18);}
  .s{font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;
    font-size:380px;font-weight:800;color:#14200A;line-height:1;
    text-shadow:0 4px 0 rgba(255,255,255,.25);}
</style></head><body>
  <div class="icon"><div class="coin"><div class="ring"></div><div class="s">$</div></div></div>
</body></html>
