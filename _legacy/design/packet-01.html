<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Getting Money App - Packet 01 Mockup</title>
  <style>
    :root {
      --bg: oklch(1 0 0);
      --surface: oklch(0.972 0.004 48);
      --surface-elevated: oklch(0.992 0.002 48);
      --ink: oklch(0.18 0.012 52);
      --muted: oklch(0.455 0.018 52);
      --primary: oklch(0.607 0.163 47.7);
      --primary-pressed: oklch(0.54 0.15 47.7);
      --accent: oklch(0.35 0.095 218);
      --success: oklch(0.548 0.132 145);
      --warning: oklch(0.68 0.13 78);
      --danger: oklch(0.56 0.16 28);
      --border: oklch(0.9 0.006 52);
      --shadow: 0 8px 20px oklch(0.18 0.012 52 / 0.08);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, oklch(0.94 0.018 48), transparent 38%),
        oklch(0.93 0.006 52);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 46px;
      padding: 12px;
      background: oklch(0.13 0.006 52);
      box-shadow: 0 32px 80px oklch(0.18 0.012 52 / 0.22);
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 36px;
      background: var(--bg);
    }

    .status {
      height: 48px;
      padding: 16px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .system-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
    }

    .pill-icon {
      width: 22px;
      height: 11px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      position: relative;
    }

    .pill-icon::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 14px;
      height: 5px;
      border-radius: 999px;
      background: var(--ink);
    }

    main {
      height: calc(100% - 48px);
      padding: 4px 20px 92px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .title-block {
      display: grid;
      gap: 2px;
    }

    .caption {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 800;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }

    .balance {
      padding: 22px;
      border-radius: var(--radius-lg);
      background:
        linear-gradient(135deg, oklch(0.992 0.002 48), oklch(0.955 0.018 48));
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .balance-top,
    .module-top,
    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .big-number {
      margin-top: 8px;
      font-size: 54px;
      line-height: 0.96;
      font-weight: 800;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .subline {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: oklch(0.925 0.025 145);
      color: oklch(0.37 0.11 145);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .module {
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      margin-bottom: 14px;
    }

    .debt-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
      margin-top: 14px;
    }

    .debt-number {
      font-size: 38px;
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .pay-button {
      height: 42px;
      border: 0;
      border-radius: var(--radius-md);
      padding: 0 16px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 800;
      font-family: inherit;
    }

    .mini-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mini {
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 13px 14px;
    }

    .mini-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    .exercise-list {
      display: grid;
      gap: 14px;
    }

    .exercise-row {
      display: grid;
      gap: 8px;
    }

    .exercise-name {
      font-size: 15px;
      font-weight: 800;
    }

    .exercise-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 8px;
      border-radius: 999px;
      background: oklch(0.91 0.006 52);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
    }

    .fill.blue {
      background: var(--accent);
    }

    .fill.warn {
      background: var(--warning);
    }

    .tabbar {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 70px;
      border-radius: 28px;
      background: oklch(0.992 0.002 48 / 0.94);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 0 8px;
      box-shadow: var(--shadow);
    }

    .tab {
      display: grid;
      justify-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .tab.active {
      color: var(--primary-pressed);
    }

    .tab svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status">
        <div>9:41</div>
        <div class="system-icons">
          <span>5G</span>
          <span class="pill-icon" aria-hidden="true"></span>
        </div>
      </div>

      <main>
        <div class="topbar">
          <div class="title-block">
            <span class="caption">Today</span>
            <h1>Getting Money</h1>
          </div>
          <div class="avatar">YM</div>
        </div>

        <section class="balance" aria-label="Bank balance">
          <div class="balance-top">
            <span class="label">BANK BALANCE</span>
            <span class="status-pill"><span class="status-dot"></span> On track</span>
          </div>
          <div class="big-number">$184</div>
          <div class="subline">+$24 earned today from 96 logged reps</div>
        </section>

        <section class="module" aria-label="Debt summary">
          <div class="module-top">
            <div>
              <div class="label">REP DEBT</div>
              <div class="debt-number">18</div>
            </div>
            <button class="pay-button">Plan payoff</button>
          </div>
          <div class="subline">Goal: get back to zero. Money cannot clear debt.</div>
        </section>

        <div class="mini-strip">
          <div class="mini">
            <div class="label">STREAK</div>
            <div class="mini-value">12 days</div>
          </div>
          <div class="mini">
            <div class="label">ROUND PLAN</div>
            <div class="mini-value">3 circles</div>
          </div>
        </div>

        <section class="module" aria-label="Exercise progress">
          <h2 class="section-title">Daily targets</h2>
          <div class="exercise-list">
            <div class="exercise-row">
              <div class="row-top">
                <span class="exercise-name">Push-ups</span>
                <span class="exercise-count">42 / 60</span>
              </div>
              <div class="track"><div class="fill" style="width:70%"></div></div>
            </div>
            <div class="exercise-row">
              <div class="row-top">
                <span class="exercise-name">Pull-ups</span>
                <span class="exercise-count">7 / 10</span>
              </div>
              <div class="track"><div class="fill blue" style="width:70%"></div></div>
            </div>
            <div class="exercise-row">
              <div class="row-top">
                <span class="exercise-name">Squats</span>
                <span class="exercise-count">47 / 75</span>
              </div>
              <div class="track"><div class="fill warn" style="width:63%"></div></div>
            </div>
          </div>
        </section>
      </main>

      <nav class="tabbar" aria-label="Primary navigation">
        <div class="tab active">
          <svg viewBox="0 0 24 24"><path d="M4 12h4l2-7 4 14 2-7h4"/></svg>
          <span>Dashboard</span>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Log</span>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 8v4l3 2"/></svg>
          <span>Rounds</span>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24"><path d="M5 7h14v12H5z"/><path d="M8 7V5h8v2"/><path d="M8 13h8"/></svg>
          <span>Debt</span>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.8-1L14.4 3h-4.8l-.3 3.1a7 7 0 0 0-1.8 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.8 1l.3 3.1h4.8l.3-3.1a7 7 0 0 0 1.8-1l2.4 1 2-3.4L18.9 13a7 7 0 0 0 .1-1z"/></svg>
          <span>Settings</span>
        </div>
      </nav>
    </div>
  </div>
</body>
</html>
